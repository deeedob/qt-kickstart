name: Release packages

# Builds Qt itself with vcpkg. The first run takes hours, so it runs on
# demand only; later runs reuse the binary cache.
on:
  workflow_dispatch:

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      # libb2, a qtbase dependency outside Windows, is built with autotools.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 autoconf autoconf-archive automake libtool pkg-config \
            '^libxcb.*-dev' libx11-xcb-dev libxrender-dev libxi-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgl1-mesa-dev libegl1-mesa-dev libwayland-dev \
            libfontconfig1-dev libdbus-1-dev patchelf
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Install pinned AppImage packaging tools
        if: runner.os == 'Linux'
        run: |
          mkdir -p .cache/linuxdeploy
          cd .cache/linuxdeploy
          curl --fail --location --retry 3 --output linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum --check
          chmod +x linuxdeploy-x86_64.AppImage
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf autoconf-archive automake libtool

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Key the vcpkg cache on the pinned vcpkg commit
        id: vcpkg
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:external/vcpkg)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        with:
          path: .vcpkg-cache
          key: release-vcpkg-${{ matrix.os }}-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg/triplets/**/*.cmake') }}
          restore-keys: release-vcpkg-${{ matrix.os }}-

      - name: Configure, build, test and package
        run: |
          cmake --preset release -DAPP_USE_VCPKG_QT=ON
          cmake --workflow --preset release

      - uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ matrix.os }}
          path: |
            build/release/*.dmg
            build/release/*.zip
            build/release/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-symbols-${{ matrix.os }}-${{ github.sha }}
          path: build/release/symbols/RelWithDebInfo/
          if-no-files-found: error

      # Saved even when a step fails, so the hours spent building Qt are not lost.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .vcpkg-cache
          key: release-vcpkg-${{ matrix.os }}-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg/triplets/**/*.cmake') }}
